name: Release HomeKit Firmware

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Create a new prerelease or promote the existing prerelease"
        required: true
        default: publish_prerelease
        type: choice
        options:
          - publish_prerelease
          - promote
      release_tag:
        description: "Release tag, for example htgdo-v2-homekit-1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homekit-release
  cancel-in-progress: false

env:
  PLATFORMIO_VERSION: "6.1.19"
  BUILD_ENVIRONMENT: htgdo_v2_esp32

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    outputs:
      operation: ${{ steps.validate.outputs.operation }}
      release_tag: ${{ steps.validate.outputs.release_tag }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate operation and release state
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Release workflow must run from main; current ref is ${GITHUB_REF}" >&2
            exit 1
          fi
          if ! [[ "${RELEASE_TAG}" =~ ^htgdo-v2-homekit-[1-9][0-9]*$ ]]; then
            echo "Release tag must match htgdo-v2-homekit-N with N greater than zero" >&2
            exit 1
          fi

          if [ "${OPERATION}" = "publish_prerelease" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              echo "Tag already exists: ${RELEASE_TAG}" >&2
              exit 1
            fi
            if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "Release already exists: ${RELEASE_TAG}" >&2
              exit 1
            fi
          elif [ "${OPERATION}" = "promote" ]; then
            release_json=$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --json isDraft,isPrerelease,tagName,targetCommitish)
            if [ "$(jq -r .tagName <<<"${release_json}")" != "${RELEASE_TAG}" ] \
              || [ "$(jq -r .isDraft <<<"${release_json}")" != "false" ] \
              || [ "$(jq -r .isPrerelease <<<"${release_json}")" != "true" ]; then
              echo "Promotion requires an existing, published prerelease with the exact tag" >&2
              exit 1
            fi
          else
            echo "Unsupported release operation: ${OPERATION}" >&2
            exit 1
          fi

          echo "operation=${OPERATION}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build prerelease assets
    if: inputs.operation == 'publish_prerelease'
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: ${{ runner.os }}-platformio-${{ env.PLATFORMIO_VERSION }}

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install "platformio==${PLATFORMIO_VERSION}"

      - name: Build release firmware
        env:
          HTGDO_RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: pio run -e "${BUILD_ENVIRONMENT}"

      - name: Verify embedded metadata and OTA capacity
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          python scripts/release_assets.py verify-build \
            --elf ".pio/build/${BUILD_ENVIRONMENT}/firmware.elf" \
            --ota ".pio/build/${BUILD_ENVIRONMENT}/firmware.bin" \
            --partitions partitions.csv \
            --tag "${RELEASE_TAG}"

      - name: Verify complete offset-zero factory image with esptool
        run: |
          set -euo pipefail
          build_dir=".pio/build/${BUILD_ENVIRONMENT}"
          esptool_python="${HOME}/.platformio/penv/bin/python"
          boot_app=$(find "${HOME}/.platformio/packages/framework-arduinoespressif32" \
            -type f -name boot_app0.bin -print -quit)
          if [ ! -x "${esptool_python}" ]; then
            echo "Unable to locate the pioarduino esptool Python environment" >&2
            exit 1
          fi
          if [ -z "${boot_app}" ]; then
            echo "Unable to locate boot_app0.bin" >&2
            exit 1
          fi
          "${esptool_python}" -m esptool --chip esp32 merge-bin \
            -o verified.factory.bin \
            0x1000 "${build_dir}/bootloader.bin" \
            0x8000 "${build_dir}/partitions.bin" \
            0xe000 "${boot_app}" \
            0x10000 "${build_dir}/firmware.bin"
          cmp "${build_dir}/firmware.factory.bin" verified.factory.bin

      - name: Prepare release and Pages content
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          set -euo pipefail
          python scripts/release_assets.py prepare \
            --build-dir ".pio/build/${BUILD_ENVIRONMENT}" \
            --output-dir release_assets \
            --tag "${RELEASE_TAG}"
          python scripts/release_assets.py verify-release \
            --directory release_assets \
            --tag "${RELEASE_TAG}"

          mkdir pages
          cp docs/index.html docs/flash.html docs/installer.js pages/
          cp release_assets/* pages/

          secplus_sha=$(git -C lib/secplus rev-parse HEAD)
          {
            echo "# ${RELEASE_TAG}"
            echo
            echo "- Source commit: ${GITHUB_SHA}"
            echo "- secplus submodule: ${secplus_sha}"
            echo "- Hardware target: htgdo.v2.esp32 (30-pin ESP32)"
            echo "- PlatformIO: ${PLATFORMIO_VERSION}"
            echo "- pioarduino platform: 55.03.38"
            echo "- HomeSpan: 2.1.8"
            echo "- Improv: 1.2.5"
            echo
            echo "This prerelease validates the public installer and update workflow."
            echo "Real garage-door-opener validation is incomplete; this firmware is not approved for shipping or pre-flashing."
          } > release-notes.md

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: homekit-release-assets
          if-no-files-found: error
          retention-days: 7
          path: |
            release_assets
            release-notes.md

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  create_prerelease:
    name: Create GitHub prerelease
    if: inputs.operation == 'publish_prerelease'
    runs-on: ubuntu-latest
    needs:
      - preflight
      - build
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: homekit-release-assets
          path: publication

      - name: Create immutable prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" publication/release_assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TAG}" \
            --notes-file publication/release-notes.md \
            --prerelease

  deploy:
    name: Deploy Web Installer
    if: inputs.operation == 'publish_prerelease'
    runs-on: ubuntu-latest
    needs:
      - build
      - create_prerelease
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  promote:
    name: Promote existing prerelease
    if: inputs.operation == 'promote'
    runs-on: ubuntu-latest
    needs: preflight
    permissions:
      contents: write
    steps:
      - name: Checkout source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify unchanged release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          set -euo pipefail
          release_json=$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json isDraft,isPrerelease,tagName,targetCommitish)
          if [ "$(jq -r .isDraft <<<"${release_json}")" != "false" ] \
            || [ "$(jq -r .isPrerelease <<<"${release_json}")" != "true" ]; then
            echo "Release is no longer an eligible prerelease" >&2
            exit 1
          fi

          target_commit=$(jq -r .targetCommitish <<<"${release_json}")
          tag_commit=$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")
          if ! [[ "${target_commit}" =~ ^[0-9a-f]{40}$ ]] \
            || [ "${target_commit}" != "${tag_commit}" ]; then
            echo "Release target and tag source commit do not match" >&2
            exit 1
          fi

          mkdir promotion_assets
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --dir promotion_assets
          python scripts/release_assets.py verify-release \
            --directory promotion_assets \
            --tag "${RELEASE_TAG}"

      - name: Promote without rebuilding or replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --prerelease=false
