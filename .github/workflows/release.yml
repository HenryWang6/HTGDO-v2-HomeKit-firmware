name: Release HomeKit Firmware

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Hardware-linked release tag, for example htgdo-v2.2-homekit-1"
        required: true
        type: string
      platformio_version:
        description: "PlatformIO version used for the release build"
        required: false
        default: "6.1.19"
        type: string

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.inputs.outputs.release_tag }}
      platformio_version: ${{ steps.inputs.outputs.platformio_version }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release inputs
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PLATFORMIO_VERSION: ${{ inputs.platformio_version }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Release workflow must be run from main. Current ref: ${GITHUB_REF}" >&2
            exit 1
          fi

          if ! [[ "${RELEASE_TAG}" =~ ^htgdo-v2\.2-homekit-[0-9]+$ ]]; then
            echo "Release tag must match htgdo-v2.2-homekit-N. Got: ${RELEASE_TAG}" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag already exists: ${RELEASE_TAG}" >&2
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release already exists: ${RELEASE_TAG}" >&2
            exit 1
          fi

          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "platformio_version=${PLATFORMIO_VERSION}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build release assets
    runs-on: ubuntu-latest
    needs: preflight
    permissions:
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
          key: ${{ runner.os }}-platformio-${{ needs.preflight.outputs.platformio_version }}

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install "platformio==${{ needs.preflight.outputs.platformio_version }}"

      - name: Set build version
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          set -euo pipefail
          jq --arg version "${RELEASE_TAG}" '.version = $version' docs/manifest.json > docs/manifest.tmp
          mv docs/manifest.tmp docs/manifest.json

      - name: Build firmware
        run: pio run -e ratgdo_esp32dev

      - name: Prepare release and Pages assets
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          set -euo pipefail

          BUILD_DIR=".pio/build/ratgdo_esp32dev"
          mkdir -p output/firmware pages/firmware release_assets

          cp "${BUILD_DIR}/firmware.bin" "output/firmware/${RELEASE_TAG}.firmware.bin"
          cp "${BUILD_DIR}/bootloader.bin" "output/firmware/${RELEASE_TAG}.bootloader.bin"
          cp "${BUILD_DIR}/partitions.bin" "output/firmware/${RELEASE_TAG}.partitions.bin"
          cp "${BUILD_DIR}/firmware.elf" "release_assets/${RELEASE_TAG}.elf"
          cp "${BUILD_DIR}/firmware.factory.bin" "release_assets/${RELEASE_TAG}.factory.bin"
          cp docs/firmware/boot_app0.bin output/firmware/boot_app0.bin

          md5sum "output/firmware/${RELEASE_TAG}.firmware.bin" | awk '{print $1}' > "output/firmware/${RELEASE_TAG}.firmware.md5"

          jq -n \
            --arg version "${RELEASE_TAG}" \
            --arg bootloader "firmware/${RELEASE_TAG}.bootloader.bin" \
            --arg partitions "firmware/${RELEASE_TAG}.partitions.bin" \
            --arg firmware "firmware/${RELEASE_TAG}.firmware.bin" \
            '{
              "name": "homekit-ratgdo",
              "version": $version,
              "new_install_prompt_erase": true,
              "new_install_improv_wait_time": 60,
              "builds": [
                {
                  "chipFamily": "ESP32",
                  "parts": [
                    {"path": $bootloader, "offset": 4096},
                    {"path": $partitions, "offset": 32768},
                    {"path": "firmware/boot_app0.bin", "offset": 57344},
                    {"path": $firmware, "offset": 65536}
                  ]
                }
              ]
            }' > output/manifest.json

          find docs -maxdepth 1 -type f -exec cp {} pages/ \;
          [ -d docs/ota ] && cp -R docs/ota pages/
          [ -d docs/webpage ] && cp -R docs/webpage pages/
          [ -d docs/logs ] && cp -R docs/logs pages/
          cp output/manifest.json pages/manifest.json
          cp output/firmware/* pages/firmware/

          cp output/manifest.json release_assets/manifest.json
          cp output/firmware/* release_assets/

          (
            cd release_assets
            find . -type f \( -name '*.bin' -o -name '*.elf' -o -name '*.md5' -o -name 'manifest.json' \) -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )
          cp release_assets/SHA256SUMS pages/SHA256SUMS

          {
            echo "# HTGDO-v2.2 HomeKit ${RELEASE_TAG}"
            echo ""
            echo "- Source commit: ${GITHUB_SHA}"
            echo "- PlatformIO version: ${{ needs.preflight.outputs.platformio_version }}"
            echo "- Release tag: ${RELEASE_TAG}"
            echo ""
            echo "## SHA256SUMS"
            echo ""
            echo '```text'
            cat pages/SHA256SUMS
            echo '```'
          } > release_assets/release-notes.md

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release_assets

  deploy:
    name: Deploy Web Installer
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - preflight
      - deploy
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release_assets

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: HTGDO-v2.2 HomeKit ${{ needs.preflight.outputs.release_tag }}
          body_path: release_assets/release-notes.md
          draft: false
          prerelease: false
          files: |
            release_assets/*.bin
            release_assets/*.elf
            release_assets/*.md5
            release_assets/manifest.json
            release_assets/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
